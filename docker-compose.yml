services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: receipt_bot
      POSTGRES_PASSWORD: receipt_bot
      POSTGRES_DB: receipt_bot
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipt_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
